<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Asha Photo Editor</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app">
        <header class="top">
            <img src="https://res.cloudinary.com/dbrjr5zqp/image/upload/v1791640733/LOGO_Dark_nnfgu3.svg" width="90px"
                alt="">
            <span class="sp"></span>
            <button class="ib" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg viewBox="0 0 24 24">
                    <path d="M9 14L4 9l5-5" />
                    <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
                </svg></button><button class="ib" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled><svg
                    viewBox="0 0 24 24">
                    <path d="M15 14l5-5-5-5" />
                    <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" />
                </svg></button>
            <div class="export" id="exp"><button class="btn sm" id="d1080">Download 1080p</button><button
                    class="btn ghost sm" id="d720">Download 720p</button></div>
            <label class="ib" for="file" title="Add photos" aria-label="Add photos"><svg viewBox="0 0 24 24">
                    <path d="M12 5v14M5 12h14" />
                </svg></label>
            <input type="file" id="file" hidden
                accept="image/*,.heic,.heif,.avif,.dng,.cr2,.cr3,.crw,.nef,.nrw,.arw,.srf,.sr2,.orf,.rw2,.raf,.pef,.srw,.raw,.3fr,.erf,.kdc,.mrw,.x3f,.rwl,.iiq">
        </header>
        <nav class="tabs" role="tablist" aria-label="Tools">
            <button class="tab on" role="tab" aria-selected="true" data-t="g"><svg viewBox="0 0 24 24">
                    <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
                    <circle cx="15" cy="7" r="2" />
                    <circle cx="9" cy="17" r="2" />
                </svg>Basic</button>
            <button class="tab" role="tab" aria-selected="false" data-t="c"><svg viewBox="0 0 24 24">
                    <path d="M12 3.5s6 6.2 6 10.3a6 6 0 0 1-12 0C6 9.7 12 3.5 12 3.5z" />
                </svg>Color</button>
            <button class="tab" role="tab" aria-selected="false" data-t="v"><svg viewBox="0 0 24 24">
                    <path d="M4 4v16h16" />
                    <path d="M7 16c4 0 4-8 10-8" />
                </svg>Curves</button>
            <button class="tab" role="tab" aria-selected="false" data-t="t"><svg viewBox="0 0 24 24">
                    <path d="M5 5h.01M12 5h.01M19 5h.01M8.5 12h.01M15.5 12h.01M5 19h.01M12 19h.01M19 19h.01"
                        stroke-width="2.6" />
                </svg>Texture</button>
        </nav>
        <main class="center">
            <div class="stage" id="stage">
                <div class="drop" id="drop" role="button" tabindex="0" aria-label="Drop a photo here, or choose one">
                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <rect x="12" y="6" width="40" height="30" rx="4" />
                        <circle cx="24" cy="17" r="3" />
                        <path d="M13 31l10-9 8 7 7-6 13 10" />
                        <g class="ar">
                            <path d="M32 40v12M26 47l6 6 6-6" />
                        </g>
                        <path d="M14 58h36" />
                    </svg><b>Drag and drop your photos here</b><small>or tap to choose one from your device</small><span
                        class="fm"><i>JPG</i><i>PNG</i><i>WebP</i><i>HEIC</i><i>RAW</i></span>
                </div>
                <div class="viewer" id="viewer" hidden>
                    <canvas id="cO"></canvas><canvas id="cG"></canvas><canvas id="dots"></canvas>
                    <div class="divider" id="div" tabindex="0" role="slider" aria-label="Before and after"
                        aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span class="grip">‹ ›</span></div>
                    <div class="lab l" id="labB">Before</div>
                    <div class="lab r" id="labA">After</div>
                    <div class="cap" id="cap" aria-live="polite"></div>
                </div>
            </div>
            <div class="below"><button class="btn big" id="auto">Auto color grade</button></div>
        </main>
        <aside class="panel">
            <p class="hint" id="hint"></p>
            <div class="pane on" id="p-g">
                <div class="edits open" id="gwrap">
                    <div class="col" id="gs"></div><button class="btn ghost" id="reset">Reset</button>
                </div>
            </div>
            <div class="pane" id="p-c">
                <div class="ct">Color wheels</div>
                <div class="wheels" id="wheels"></div>
                <div class="ct">Single colors</div>
                <div class="col" id="hs"></div>
            </div>
            <div class="pane" id="p-v"><canvas id="cv" width="240" height="240"></canvas>
                <div class="chips" id="ch"></div><button class="btn ghost" id="cr">Reset curve</button>
            </div>
            <div class="pane" id="p-t">
                <div class="col" id="ts"></div>
            </div>
        </aside>
    </div>
    <div class="sv" id="sv" hidden>
        <div class="svb"><img id="svi" alt="Your graded photo">
            <p>Press and hold the photo to save it, or right-click it on a computer.</p><a class="btn" id="sva" href="#"
                download="photo.jpg">Save photo</a><button class="btn ghost" id="svx">Close</button>
        </div>
    </div>
    <div class="ash" id="ash"><svg width="32" height="32" viewBox="0 0 32 32">
            <path d="M5 5L26 12L12 26Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round" />
            <path d="M5 5L26 12L12 26Z" fill="var(--accent)" stroke="var(--accent)" stroke-width="3"
                stroke-linejoin="round" />
        </svg><span>Asha</span><i class="rp"></i></div>

    <script src="script.js"></script>
</body>

</html>
